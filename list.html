<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>쇼핑리스트</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="container">
    <header class="list-header">
      <h1>🛒 쇼핑리스트</h1>
      <div class="user-info">
        <span id="username-display"></span>
        <button id="logout-btn">로그아웃</button>
      </div>
    </header>

    <form id="add-form" class="add-form">
      <input type="text" id="item-name" placeholder="구매할 항목" required />
      <input type="number" id="item-quantity" placeholder="수량" min="1" value="1" />
      <button type="submit">추가</button>
    </form>

    <ul id="item-list" class="item-list"></ul>

    <p id="empty-message" class="empty-message">쇼핑리스트가 비어 있습니다.</p>
  </div>

  <script src="js/list.js"></script>
</body>
</html>
